<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

.header {
    background: #202124;
    color: white;
    padding: 25px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin-top: 8px;
    color: #d0d0d0;
}

.time-box {
    text-align: center;
    background: white;
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
    font-size: 18px;
}

.dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.full {
    grid-column: 1 / -1;
}

.locked {
    text-align: center;
    padding: 100px 20px;
    font-size: 22px;
    color: #666;
}

@media (max-width: 900px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}

</style>

<script>


// ----------------------------------------------------
// INDIA TIME
// ----------------------------------------------------

function getIndiaTime() {

    const now = new Date();

    const indiaTime = new Date(
        now.toLocaleString(
            "en-US",
            {timeZone: "Asia/Kolkata"}
        )
    );

    return indiaTime;

}


// ----------------------------------------------------
// TIME WINDOW CHECK
// ----------------------------------------------------

function isBetween(hour, start, end) {

    return hour >= start && hour < end;

}


// ----------------------------------------------------
// CONTROL TASK VISIBILITY
// ----------------------------------------------------

function updateDashboard() {

    const indiaTime = getIndiaTime();

    const hours = indiaTime.getHours();

    const minutes = indiaTime.getMinutes();

    const timeString =
        String(hours).padStart(2, '0')
        + ":"
        + String(minutes).padStart(2, '0');

    document.getElementById(
        "currentTime"
    ).innerText = timeString + " IST";


    const tasks = {

        task1: isBetween(hours, 15, 17),

        task2: isBetween(hours, 18, 20),

        task3: isBetween(hours, 13, 14),

        task4: isBetween(hours, 18, 21),

        task5: isBetween(hours, 17, 19),

        task6: isBetween(hours, 16, 18)

    };


    let active = [];


    for (const task in tasks) {

        const element =
            document.getElementById(task);

        if (tasks[task]) {

            element.style.display = "block";

            active.push(
                task.replace("task", "Task ")
            );

        } else {

            element.style.display = "none";

        }

    }


    if (active.length > 0) {

        document.getElementById(
            "activeTasks"
        ).innerHTML =
            "Currently active: <b>"
            + active.join(", ")
            + "</b>";

    } else {

        document.getElementById(
            "activeTasks"
        ).innerHTML =
            "No task visualization is active at this time.";

    }

}


// Update immediately
updateDashboard();


// Update every minute
setInterval(
    updateDashboard,
    60000
);

</script>
